# Copy to /etc/apache2/sites-available/aischolarhub.conf
# Requires: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# Then: sudo a2ensite aischolarhub && sudo systemctl reload apache2
# Then: sudo certbot --apache -d aischolarhub.seedsnet.org
#
# Edit aischolarhub.seedsnet.org below to your real subdomain first.

<VirtualHost *:80>
    ServerName aischolarhub.seedsnet.org

    ProxyPreserveHost On
    ProxyRequests Off

    # Websocket upgrade for LibreChat's streaming chat responses — without
    # this block, responses arrive all at once instead of streaming, or
    # hang entirely. This is the one thing that's easy to miss on Apache
    # (nginx needs an equivalent Upgrade/Connection header pair; Caddy
    # handles it automatically either way).
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3080/$1" [P,L]

    ProxyPass / http://127.0.0.1:3080/
    ProxyPassReverse / http://127.0.0.1:3080/

    # Student file uploads for RAG can be sizeable — matches
    # fileConfig.totalSizeLimit (100MB) in config/librechat.yaml.
    LimitRequestBody 104857600

    ErrorLog ${APACHE_LOG_DIR}/aischolarhub-error.log
    CustomLog ${APACHE_LOG_DIR}/aischolarhub-access.log combined
</VirtualHost>
