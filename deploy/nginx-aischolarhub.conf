# Copy to /etc/nginx/sites-available/aischolarhub, symlink into
# sites-enabled, then run certbot --nginx to add the TLS block
# automatically. See deploy/README.md Path A.

server {
    listen 80;
    listen [::]:80;
    server_name aischolarhub.yourcollege.edu;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LibreChat uses websockets for streaming responses — without this
        # upgrade block, chat responses will hang or arrive all at once
        # instead of streaming.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Student file uploads for RAG can be sizeable — matches
        # fileConfig.totalSizeLimit (100MB) in config/librechat.yaml.
        client_max_body_size 100M;
    }
}
