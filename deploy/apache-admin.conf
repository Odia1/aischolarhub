<VirtualHost *:80>
    ServerName admin.aischolarhub.seedsnet.org
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3081/
    ProxyPassReverse / http://127.0.0.1:3081/
    ErrorLog ${APACHE_LOG_DIR}/admin-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/admin-panel-access.log combined
</VirtualHost>