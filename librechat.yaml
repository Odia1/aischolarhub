version: 1.3.14
cache: true

# Enable automatic title generation
#titleConvo: true

interface:
  appTitle: "AI Scholar Hub"
  endpointsMenu: false
  modelSelect: false
  agents: true
  fileSearch: true
  fileCitations: true
  webSearch: true
  

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  allowedAddresses:
    - "searxng:8080"
  searxngSearchOptions:
    engines:
      - google
      - bing
      - brave
      - startpage
      - qwant
    language: "en"
    timeout: 12000
  rerankerType: "none"
  safeSearch: 1

mcpSettings:
  allowedDomains:
    - "api.openalex.org"
    - "api.semanticscholar.org"
    - "api.crossref.org"
    - "http://academic-research-mcp:8000"

mcpServers:
  academic-research:
    type: streamable-http
    url: http://academic-research-mcp:8000/mcp
    
# =============================================================================
# AI SCHOLAR HUB
#
#
# All API credentials remain in .env.
# =============================================================================



# =============================================================================
# REGISTRATION / DOMAIN RESTRICTION
# =============================================================================

registration:
  allowedDomains:
    - "seedsnet.org"
    - "ravenshaw.in"
    - "seedsnet.in"


# =============================================================================
# FILE UPLOAD / IMPORT RATE LIMITS
# =============================================================================

rateLimits:

  fileUploads:
    ipMax: 20
    ipWindowInMinutes: 60
    userMax: 10
    userWindowInMinutes: 60

  conversationsImport:
    ipMax: 10
    ipWindowInMinutes: 60
    userMax: 5
    userWindowInMinutes: 60


# =============================================================================
# TOKEN BALANCE / USAGE CONTROL
# =============================================================================
balance:
  enabled: true
  startBalance: 1000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: "days"
  refillAmount: 1000000
  
# =============================================================================
# AI SCHOLAR HUB USAGE POLICY
# =============================================================================



# =============================================================================
# AI ENDPOINTS
#
# All three are OpenAI-compatible custom endpoints.
# There is deliberately NO native azureOpenAI or google endpoint here.
# =============================================================================

endpoints:

  custom:

    - name: "Azure OpenAI Undergrad Tutor"
      apiKey: "${AZURE_SI_UG_API_KEY}"
      baseURL: "https://aischolar-si-ug.services.ai.azure.com/openai/v1/"
      iconURL: "/images/aischolarhub-icon-100x55.png"
      actions: true
      models:
        default:
          - "gpt-4.1-mini"
        fetch: false
      titleConvo: true

    - name: "Azure OpenAI Scholar Research"
      apiKey: "${AZURE_F1_API_KEY}"
      baseURL: "https://aischolar-f1.services.ai.azure.com/openai/v1/"
      iconURL: "/images/aischolarhub-icon-100x55.png"
      actions: true
      models:
        default:
          - "gpt-5.4-mini"
        fetch: false
      titleConvo: true

    - name: "AI Scholar Free Router"
      apiKey: "${GEMINI_PROXY_API_KEY}"
      baseURL: "http://model-router:8000/v1/"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      headers:
        X-AIS-Conversation-ID: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-AIS-User-ID: "{{LIBRECHAT_USER_ID}}"
      models:
        default:
          - "class-a"
          - "class-b"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "AI Scholar Free Router"

    # Temporary rollback endpoint. Existing database overrides may still
    # reference this name while persona-to-class mappings are migrated.
    - name: "Gemini Academic Assistant"
      apiKey: "${GEMINI_PROXY_API_KEY}"
      baseURL: "http://gemini-proxy:8000/v1/"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      models:
        default:
          - "gemini-3.5-flash"
          - "gemini-3.5-flash-lite"
          - "gemini-3.7-flash"
          - "gemini-3.8-flash"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Gemini Academic Assistant"





# =============================================================================
# CURATED AI SCHOLAR HUB MODEL EXPERIENCES
# =============================================================================

modelSpecs:

  # Initially false so we can test the personas without locking the UI.
  enforce: false
  prioritize: false

  list:

    # =========================================================================
    # UNDERGRADUATE SOCRATIC TUTOR
    # =========================================================================

    - name: "Undergrad Socratic Tutor"
      label: "Undergrad Socratic Tutor"
      fileSearch: true

      description: >
        Step-by-step academic guidance using the Socratic method,
        emphasizing learning and reasoning rather than simply providing
        answers.

      default: true
      showIconInMenu: true
      #iconURL: "/images/AI-Scholar-Hub.png"
      showIconInHeader: true
      
      preset:

        endpoint: "AI Scholar Free Router"
        model: "class-b"
        modelLabel: "Socratic Tutor"
# THIS IS YOUR CUSTOM WELCOME MESSAGE FOR NEW CHATS:
        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. How can I help up with your study today?"

    # =========================================================================
    # PhD / POST-DOC RESEARCH SYNTHESIZER
    # =========================================================================

    - name: "PhD & Post-Doc Research"

      label: "PhD & Post-Doc Research Synthesizer"
      fileSearch: true

      description: >
        Advanced research support for literature synthesis, methodology,
        statistical reasoning, technical analysis, and scholarly writing.

      default: false
      showIconInMenu: true

      preset:

        endpoint: "AI Scholar Free Router"
        model: "class-a"
        modelLabel: "Research Synthesizer"

        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. What research concept are you working on today?"
  
    - name: "K-12 Socratic Tutor"
      label: "Socratic Tutor for School Students"
      fileSearch: true
      description: >
        Tutoring young learners and school students using the Socratic method.

      preset:
        endpoint: "AI Scholar Free Router"
        model: "class-b"
        modelLabel: "Socratic Academic Assistant"

        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. What grade are you in, and what subject or problem would you like help with today?"

# =============================================================================
# FILE UPLOADS
# =============================================================================

fileConfig:

  serverFileSizeLimit: 30

  endpoints:

    default:

      fileLimit: 5
      fileSizeLimit: 30
      totalSizeLimit: 100

      supportedMimeTypes:
        - "application/pdf"
        - "text/plain"
        - "text/markdown"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
