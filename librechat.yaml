version: 1.3.14
cache: true

# Enable automatic title generation
#titleConvo: true

interface:
  appTitle: "AI Scholar Hub"
  endpointsMenu: false
  modelSelect: false
  agents: true
  fileSearch: true
  fileCitations: true
  webSearch: true
  

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  allowedAddresses:
    - "searxng:8080"
  searxngSearchOptions:
    engines:
      - google
      - bing
      - brave
      - startpage
      - qwant
    language: "en"
    timeout: 12000
  rerankerType: "none"
  safeSearch: 1

mcpSettings:
  allowedDomains:
    - "api.openalex.org"
    - "api.semanticscholar.org"
    - "api.crossref.org"
    - "http://academic-research-mcp:8000"

mcpServers:
  academic-research:
    type: streamable-http
    url: http://academic-research-mcp:8000/mcp
    
# =============================================================================
# AI SCHOLAR HUB
#
#
# All API credentials remain in .env.
# =============================================================================



# =============================================================================
# REGISTRATION / DOMAIN RESTRICTION
# =============================================================================

registration:
  allowedDomains:
    - "seedsnet.org"
    - "ravenshaw.in"
    - "seedsnet.in"


# =============================================================================
# FILE UPLOAD / IMPORT RATE LIMITS
# =============================================================================

rateLimits:

  fileUploads:
    ipMax: 20
    ipWindowInMinutes: 60
    userMax: 10
    userWindowInMinutes: 60

  conversationsImport:
    ipMax: 10
    ipWindowInMinutes: 60
    userMax: 5
    userWindowInMinutes: 60


# =============================================================================
# TOKEN BALANCE / USAGE CONTROL
# =============================================================================
balance:
  enabled: true
  startBalance: 1000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: "days"
  refillAmount: 1000000
  
# =============================================================================
# AI SCHOLAR HUB USAGE POLICY
# =============================================================================



# =============================================================================
# AI ENDPOINTS
#
# All three are OpenAI-compatible custom endpoints.
# There is deliberately NO native azureOpenAI or google endpoint here.
# =============================================================================

endpoints:

  custom:

    - name: "Azure OpenAI Undergrad Tutor"
      apiKey: "${AZURE_SI_UG_API_KEY}"
      baseURL: "https://aischolar-si-ug.services.ai.azure.com/openai/v1/"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      models:
        default:
          - "gpt-4.1-mini"
        fetch: false
      titleConvo: true

    - name: "Azure OpenAI Scholar Research"
      apiKey: "${AZURE_F1_API_KEY}"
      baseURL: "https://aischolar-f1.services.ai.azure.com/openai/v1/"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      models:
        default:
          - "gpt-5.4-mini"
        fetch: false
      titleConvo: true

    - name: "AI Scholar Free Router"
      apiKey: "${GEMINI_PROXY_API_KEY}"
      baseURL: "${MODEL_ROUTER_BASE_URL}"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      headers:
        X-AIS-Conversation-ID: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-AIS-User-ID: "{{LIBRECHAT_USER_ID}}"
      models:
        default:
          - "class-a"
          - "class-b"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "AI Scholar Free Router"

    # Temporary rollback endpoint. Existing database overrides may still
    # reference this name while persona-to-class mappings are migrated.
    - name: "Gemini Academic Assistant"
      apiKey: "${GEMINI_PROXY_API_KEY}"
      baseURL: "${GEMINI_PROXY_BASE_URL}"
      iconURL: "/images/favicon-16x16.png"
      actions: true
      models:
        default:
          - "gemini-3.5-flash"
          - "gemini-3.5-flash-lite"
          - "gemini-3.7-flash"
          - "gemini-3.8-flash"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Gemini Academic Assistant"





# =============================================================================
# CURATED AI SCHOLAR HUB MODEL EXPERIENCES
# =============================================================================

modelSpecs:

  # Initially false so we can test the personas without locking the UI.
  enforce: false
  prioritize: false

  list:

    # =========================================================================
    # UNDERGRADUATE SOCRATIC TUTOR
    # =========================================================================

    - name: "Undergrad Socratic Tutor"
      label: "Undergrad Socratic Tutor"
      webSearch: true
      fileSearch: true

      description: >
        Step-by-step academic guidance using the Socratic method,
        emphasizing learning and reasoning rather than simply providing
        answers.

      default: true
      showIconInMenu: true
      #iconURL: "/images/AI-Scholar-Hub.png"
      showIconInHeader: true
      
      preset:

        endpoint: "AI Scholar Free Router"
        model: "class-b"
        modelLabel: "Socratic Tutor"
        promptPrefix: >
          You are the AI Scholar Hub Undergraduate Socratic Tutor.
          Help students learn through explanation, reasoning, guided discovery,
          progressive scaffolding, misconception repair, and active retrieval.
          For straightforward factual, definitional, identification, or
          orientation questions, provide a concise substantive answer first.
          Use Socratic questions afterward only when they meaningfully advance
          understanding. Do not repeatedly withhold basic information by asking
          successive narrowing or diagnostic questions. When a question is
          genuinely ambiguous and cannot be answered usefully without
          clarification, ask one focused clarifying question. Maintain academic
          rigor, encourage independent reasoning, and do not fabricate sources.
# THIS IS YOUR CUSTOM WELCOME MESSAGE FOR NEW CHATS:
        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. How can I help you with your study today?"

    # =========================================================================
    # INSTRUCTOR ASSISTANT
    # =========================================================================

    - name: "School Teaching Assistant"
      label: "School Teacher Assistant"
      webSearch: true
      fileSearch: true
      description: >
        Grade- and subject-aware support for lesson plans, worksheets, quizzes,
        homework, revision sheets and evaluation.
      default: true
      showIconInMenu: true
      showIconInHeader: true
      preset:
        endpoint: "AI Scholar Free Router"
        model: "class-b"
        modelLabel: "School Teacher Assistant"
        greeting: "Welcome to AI Scholar Hub for teachers. What would you like to prepare: a lesson plan, worksheet, quiz, homework, revision sheet, or evaluation?"
        promptPrefix: |
          You are the AI Scholar Hub School Teacher Assistant.
          Treat the user as a professional teacher and answer directly; do not
          impose Socratic questioning. Work in English in this release.
          Use the persistent teaching profile as the default across conversations.
          Use selected or retrieved teaching materials to infer the grade, subject,
          topic and curriculum for the current task, but never silently modify the
          persistent profile. When the evidence is sufficient, state the inferred
          context briefly and proceed. Ask one concise question only when a missing
          detail materially changes the output.
          Support these primary actions: Create a Lesson Plan; Create a Worksheet;
          Create a Quiz; Create Homework; Create a Revision Sheet; Evaluate Work.
          Make outputs age-appropriate, classroom-ready and adaptable. Protect
          student privacy and assessment security. Never fabricate curriculum
          requirements, sources, quotations, retrieved content or student facts.

    - name: "Instructor Assistant"
      label: "Instructor Assistant"
      webSearch: true
      fileSearch: true
      description: >
        Direct faculty assistance for teaching, course design, assessment,
        feedback, curriculum development and research support.
      default: true
      showIconInMenu: true
      showIconInHeader: true
      preset:
        endpoint: "AI Scholar Free Router"
        model: "class-a"
        modelLabel: "Instructor Assistant"
        greeting: "Welcome to AI Scholar Hub Faculty. How can I assist with your teaching, research, or academic work today?"
        promptPrefix: |
          You are the AI Scholar Hub Instructor Assistant.
          Treat the user as a faculty colleague and answer requests directly.
          Do not impose Socratic questioning or require the faculty member to
          discover an answer through hints. Ask a concise clarifying question
          only when missing information materially affects the result.
          Support course and lesson design, explanations, examples, assignments,
          assessments, rubrics, feedback, research planning and scholarly analysis.
          Protect unpublished research, student information, examination content,
          answer keys and other confidential faculty material.
          Never fabricate sources, data, quotations or institutional policy.
          Clearly distinguish retrieved evidence, inference and uncertainty.

    # =========================================================================
    # PhD / POST-DOC RESEARCH SYNTHESIZER
    # =========================================================================

    - name: "PhD & Post-Doc Research"

      label: "PhD & Post-Doc Research Synthesizer"
      webSearch: true
      fileSearch: true

      description: >
        Advanced research support for literature synthesis, methodology,
        statistical reasoning, technical analysis, and scholarly writing.

      default: false
      showIconInMenu: true

      preset:

        endpoint: "AI Scholar Free Router"
        model: "class-a"
        modelLabel: "Research Synthesizer"

        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. What research concept are you working on today?"
  
    - name: "K-12 Socratic Tutor"
      label: "Socratic Tutor for School Students"
      webSearch: true
      fileSearch: true
      description: >
        Tutoring young learners and school students using the Socratic method.

      preset:
        endpoint: "AI Scholar Free Router"
        model: "class-b"
        modelLabel: "Socratic Academic Assistant"

        greeting: "Welcome to AI Scholar Hub — an educational initiative of SEEDS. What grade are you in, and what subject or problem would you like help with today?"

# =============================================================================
# FILE UPLOADS
# =============================================================================

fileConfig:

  serverFileSizeLimit: 30

  endpoints:

    default:

      fileLimit: 5
      fileSizeLimit: 30
      totalSizeLimit: 100

      supportedMimeTypes:
        - "application/pdf"
        - "text/plain"
        - "text/markdown"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
