name: aih-dev

services:

  api:
    container_name: aih-dev-api
    image: seeds.azurecr.io/aischolarhub-custom:dev-20260908-release-c-hierarchical-rag-v1
    restart: always
    user: "${UID}:${GID}"

    ports:
      - "127.0.0.1:3080:3080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      TZ: "America/Phoenix"
      HOST: "0.0.0.0"
      MEILI_HOST: "http://meilisearch:7700"
      LIBRECHAT_TEMP_CREDENTIALS_PATH: "/app/data/.env.temp"
      RAG_PORT: "8000"
      RAG_API_URL: "http://rag_api:8000"
      SEARXNG_INSTANCE_URL: "http://searxng:8080"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION}"
      ALLOW_EMAIL_LOGIN: "${ALLOW_EMAIL_LOGIN}"
      ALLOW_SOCIAL_REGISTRATION: "${ALLOW_SOCIAL_REGISTRATION}"
      ALLOW_SOCIAL_LOGIN: "${ALLOW_SOCIAL_LOGIN}"
      PROXY: "${PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1},mongodb,meilisearch,rag_api,vectordb,model-router,searxng,gemini-proxy,academic-research-mcp,ollama,host.docker.internal"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,::1},mongodb,meilisearch,rag_api,vectordb,model-router,searxng,gemini-proxy,academic-research-mcp,ollama,host.docker.internal"

    volumes:
      - ./.env:/app/.env
      - ./librechat.yaml:/app/librechat.yaml
      - ./api/server/services/Config/app.js:/app/api/server/services/Config/app.js:ro
      - ./api/server/services/AcademicIntelligence/knowledgeScope.js:/app/api/server/services/AcademicIntelligence/knowledgeScope.js:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
      - appdata:/app/data

    depends_on:
      - mongodb
      - rag_api
      - model-router
      - searxng
      - gemini-proxy


  mongodb:
    container_name: aih-dev-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"

    command: mongod --auth

    volumes:
      - ./data-node:/data/db


  meilisearch:
    container_name: aih-dev-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"

    environment:
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"

    volumes:
      - ./meili_data_v1.35.1:/meili_data


  vectordb:
    container_name: aih-dev-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: always

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - pgdata:/var/lib/postgresql/data


  ollama:
    container_name: aih-dev-ollama
    image: ollama/ollama:latest
    restart: always

    environment:
      OLLAMA_KEEP_ALIVE: "-1"

    volumes:
      - ./ollama_data:/root/.ollama


  rag_api:
    container_name: aih-dev-rag
    image: seeds.azurecr.io/aischolarhub-rag-api:dev-20260906-647d29295-agents-rag-rc1
    restart: always

    env_file:
      - .env

    environment:
      DB_HOST: "vectordb"
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      RAG_PORT: "8000"

    depends_on:
      - vectordb


  gemini-proxy:
    container_name: aih-dev-gemini
    image: aih-gemini:persona-policy-rc1
    restart: always

    env_file:
      - .gemini-proxy.env

    expose:
      - "8000"


  model-router:
    container_name: aih-dev-model-router
    build:
      context: ./model-router
      dockerfile: Dockerfile
    image: aih-model-router:class-routing-v1
    restart: always

    env_file:
      - .env

    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/LibreChat?authSource=admin"
      ASH_MODEL_ROUTER_API_KEY: "${ASH_MODEL_ROUTER_API_KEY:-}"
      GEMINI_PROXY_API_KEY: "${GEMINI_PROXY_API_KEY}"

    expose:
      - "8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      - mongodb


  searxng:
    container_name: aih-dev-searxng
    build:
      context: ./searxng
      dockerfile: Dockerfile
    image: aih-searxng:release-c
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET}"

    expose:
      - "8080"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  academic-research-mcp:
    container_name: aih-dev-mcp
    image: aih-mcp:persona-policy-rc1
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"


  admin-panel:
    container_name: aih-dev-admin
    image: aih-admin:release-c-branding
    restart: always

    ports:
      - "127.0.0.1:3081:3000"

    environment:
      PORT: "3000"
      SESSION_SECRET: "${ADMIN_PANEL_SESSION_SECRET}"
      API_SERVER_URL: "http://api:3080"
      VITE_API_BASE_URL: "${DOMAIN_CLIENT:-http://localhost:3080}"
      SESSION_COOKIE_SECURE: "${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}"

    depends_on:
      - api


  admin-ui:
    container_name: aih-dev-admin-ui
    image: node:22
    restart: unless-stopped

    working_dir: /app
    command: sh -c "npm start"

    ports:
      - "127.0.0.1:3090:3090"

    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/LibreChat?authSource=admin"
      JWT_SECRET: "${JWT_SECRET}"
      LIBRECHAT_INTERNAL_URL: "http://api:3080"
      RAG_API_URL: "http://rag_api:8000"
      ASH_MODEL_ROUTER_API_KEY: "${ASH_MODEL_ROUTER_API_KEY:-}"
      GEMINI_PROXY_API_KEY: "${GEMINI_PROXY_API_KEY}"

    volumes:
      - ./admin-ui:/app

    depends_on:
      - api
      - mongodb
      - rag_api
      - model-router


volumes:

  pgdata:
    external: true
    name: aih-dev-pgdata

  appdata:
    external: true
    name: aih-dev-appdata
