<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Neon Blue-Violet Gradient -->
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame (Admin/Security Container) -->
  <path d="M 50 10
           C 68 10, 82 14, 85 24
           C 85 52, 75 76, 50 90
           C 25 76, 15 52, 15 24
           C 18 14, 32 10, 50 10 Z"
        fill="url(#shieldGrad)"
        stroke="url(#aiGlow)"
        stroke-width="3"
        filter="url(#dropShadow)" />

  <!-- Academic Graduation Cap (Scholar Emblem) -->
  <polygon points="50,28 76,40 50,50 24,40" fill="url(#aiGlow)" />
  <polygon points="34,45 34,56 50,62 66,56 66,45 50,52" fill="#38bdf8" opacity="0.9" />

  <!-- Tassel / Data Node -->
  <path d="M 70 41 L 70 54 L 72 57" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="58" r="2" fill="#a855f7"/>

  <!-- Admin Gear & Circuit Nodes (Control & Intelligence) -->
  <!-- Circuit Nodes Left & Right -->
  <circle cx="28" cy="68" r="3.5" fill="#38bdf8" />
  <circle cx="72" cy="68" r="3.5" fill="#a855f7" />

  <line x1="31.5" y1="68" x2="42" y2="68" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="68.5" y1="68" x2="58" y2="68" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />

  <!-- Center Admin Hub Node -->
  <circle cx="50" cy="68" r="6" fill="url(#aiGlow)" />
  <circle cx="50" cy="68" r="2.5" fill="#ffffff" />
</svg>
